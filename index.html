<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strangr — Send an anonymous message</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Bana anonim bir soru sor veya mesaj bırak — kim olduğun görünmez 👀" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Strangr" />
  <meta property="og:title" content="Bana anonim soru sor 👀" />
  <meta property="og:description" content="Kim olduğun görünmez. Bir mesaj bırak, cevabını bekle." />
  <meta property="og:image" content="https://m.strangrchat.com/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bana anonim soru sor 👀" />
  <meta name="twitter:description" content="Kim olduğun görünmez. Bir mesaj bırak, cevabını bekle." />
  <meta name="twitter:image" content="https://m.strangrchat.com/og.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0f; color: #f2f2f7;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; background: #17171d;
      border: 1px solid #26262e; border-radius: 20px; padding: 28px 22px;
      text-align: center;
    }
    .brand { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #b8aeff; margin-bottom: 22px; }
    .avatar {
      width: 76px; height: 76px; border-radius: 50%; object-fit: cover;
      background: #26262e; margin: 0 auto 12px; display: block;
    }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .sub { color: #9a9aa5; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    textarea {
      width: 100%; min-height: 120px; resize: vertical;
      background: #0b0b0f; color: #f2f2f7; border: 1px solid #26262e;
      border-radius: 14px; padding: 14px; font-size: 15px; font-family: inherit;
      outline: none;
    }
    textarea:focus { border-color: #7c6bf2; }
    .count { text-align: right; color: #55555f; font-size: 11px; margin: 6px 2px 14px; }
    button {
      width: 100%; background: #7c6bf2; color: #fff; border: 0; border-radius: 14px;
      padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .hint { color: #55555f; font-size: 11px; margin-top: 14px; line-height: 1.5; }
    .error { color: #ff6b6b; font-size: 14px; margin-top: 12px; }
    .done h2 { font-size: 20px; margin-bottom: 8px; }
    .done p { color: #9a9aa5; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .store {
      display: inline-block; background: #24243a; color: #b8aeff; text-decoration: none;
      border: 1px solid #7c6bf2; border-radius: 14px; padding: 13px 22px;
      font-size: 15px; font-weight: 700;
    }
    .again { margin-top: 16px; background: none; border: 0; color: #9a9aa5; font-size: 13px; text-decoration: underline; width: auto; padding: 4px; }
    .hidden { display: none; }
    .spin {
      width: 26px; height: 26px; border: 3px solid #26262e; border-top-color: #7c6bf2;
      border-radius: 50%; margin: 30px auto; animation: r 0.8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    .repliesLink {
      display: block; text-align: center; color: #7c6bf2; font-size: 12px;
      font-weight: 700; text-decoration: none; margin-top: 16px;
    }
    .repliesList { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
    .replyRow { background: #0b0b0f; border: 1px solid #26262e; border-radius: 14px; padding: 14px; }
    .sentText { color: #f2f2f7; font-size: 14px; line-height: 1.5; }
    .replyBox { margin-top: 10px; padding-top: 10px; border-top: 1px solid #26262e; }
    .replyLabel { color: #b8aeff; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; }
    .replyText { color: #f2f2f7; font-size: 14px; line-height: 1.5; }
    .pending { color: #55555f; font-size: 12px; margin-top: 10px; }
    .chipsLabel { color: #55555f; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin: 0 0 8px; text-align: left; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      width: auto; background: #24243a; color: #b8aeff; border: 1px solid #33334d;
      border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; text-align: left;
    }
    .cta {
      display: block; background: #7c6bf2; color: #fff; text-decoration: none;
      border-radius: 14px; padding: 15px 18px; font-size: 16px; font-weight: 700;
    }
    .ctaSub { color: #9a9aa5; font-size: 12px; line-height: 1.5; margin: 8px 0 18px; }
    .secondary {
      width: 100%; background: #24243a; color: #b8aeff; border: 1px solid #7c6bf2;
      border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 700; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">STRANGR</div>

    <div id="loading"><div class="spin"></div></div>

    <div id="notfound" class="hidden">
      <h1 data-i18n="notFoundTitle"></h1>
      <p class="sub" data-i18n="notFoundBody"></p>
    </div>

    <div id="form" class="hidden">
      <img id="avatar" class="avatar" alt="" />
      <h1 id="nickname"></h1>
      <p class="sub" data-i18n-html="formSub"></p>
      <p class="chipsLabel" data-i18n="chipsLabel"></p>
      <div id="chips" class="chips"></div>
      <textarea id="text" maxlength="500" data-i18n-placeholder="placeholder"></textarea>
      <div class="count"><span id="count">0</span>/500</div>
      <button id="send" data-i18n="send"></button>
      <div id="error" class="error hidden"></div>
      <p class="hint" data-i18n="hint"></p>
      <a class="repliesLink" href="#r" data-i18n="myMessagesLink"></a>
      <a class="repliesLink" id="footerCta" href="https://play.google.com/store/apps/details?id=com.anonconnect.app&referrer=utm_source%3Dinbox%26utm_medium%3Dweb%26utm_campaign%3Dform" data-i18n="ctaOpen"></a>
    </div>

    <div id="done" class="done hidden">
      <h2 data-i18n="doneTitle"></h2>
      <p data-i18n-html="doneBody"></p>
      <a class="cta" id="doneCta" href="https://play.google.com/store/apps/details?id=com.anonconnect.app&referrer=utm_source%3Dinbox%26utm_medium%3Dweb%26utm_campaign%3Dsender_done" data-i18n="ctaOpen"></a>
      <p class="ctaSub" data-i18n="ctaSub"></p>
      <button class="secondary" id="copyLink" data-i18n="saveLink"></button>
      <button class="secondary" id="viewReplies" data-i18n="waitReply"></button>
      <button class="again" id="again" data-i18n="again"></button>
    </div>

    <div id="replies" class="hidden">
      <h1 data-i18n="repliesTitle"></h1>
      <p class="sub" data-i18n="repliesSub"></p>
      <div id="repliesList"></div>
      <a class="repliesLink" href="#" id="backLink" data-i18n="back"></a>
    </div>
  </div>

  <script>
    // Turkish for Turkish browsers, English for everyone else.
    var LANG = ((navigator.language || navigator.userLanguage || 'en') + '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
    var STRINGS = {
      tr: {
        title: 'Strangr — Anonim mesaj gönder',
        notFoundTitle: 'Link bulunamadı',
        notFoundBody: 'Bu anonim mesaj linki geçersiz ya da kapatılmış.',
        formSub: 'Ona anonim bir soru sor, itiraf et ya da bir şey söyle.<br />Kim olduğun asla görünmez.',
        placeholder: 'Sorunu yaz...',
        chipsLabel: 'FİKİR LAZIM MI?',
        chips: ['Hakkımda ne düşünüyorsun?', 'Bir itirafın var mı?', 'En büyük korkun ne?', 'En utanç verici anın neydi?', 'Bana bir tavsiyen var mı?'],
        ctaOpen: 'Sen de kendi soru kutunu aç →',
        ctaSub: "Strangr'ı indir, linkini story'ne koy; herkes sana anonim yazsın.",
        saveLink: 'Cevap linkimi kopyala',
        copied: 'Kopyalandı ✓',
        send: 'Anonim Gönder',
        hint: 'Gönderdiğin mesaj tamamen anonimdir. Hakaret, tehdit ve yasa dışı içerik moderasyona bildirilebilir.',
        myMessagesLink: 'Daha önce gönderdiğim mesajlar →',
        doneTitle: '📮 İletildi!',
        doneBody: 'Mesajın anonim olarak ulaştı.<br />Cevap gelirse bu sayfadan görebilirsin. Başka bir tarayıcıdan bakacaksan önce cevap linkini kopyala — hesap açmana gerek yok.',
        waitReply: 'Cevapları Gör',
        again: 'Bir mesaj daha gönder',
        repliesTitle: 'Gönderdiğim Mesajlar',
        repliesSub: 'Bu tarayıcıdan gönderdiğin mesajlar ve cevapları (varsa) — kimliğin hiçbir zaman görünmez.',
        back: '← Yeni mesaj gönder',
        noneSent: 'Bu tarayıcıdan henüz mesaj göndermedin.',
        loading: 'Yükleniyor...',
        noReply: 'Henüz cevap yok',
        replyLabel: 'CEVAP',
        rateLimited: 'Çok sık mesaj gönderdin, biraz sonra tekrar dene.',
        sendFailed: 'Gönderilemedi, tekrar dene.'
      },
      en: {
        title: 'Strangr — Send an anonymous message',
        notFoundTitle: 'Link not found',
        notFoundBody: 'This anonymous message link is invalid or has been turned off.',
        formSub: 'Ask them anything, confess, or say something.<br />Who you are is never shown.',
        placeholder: 'Write your question...',
        chipsLabel: 'NEED IDEAS?',
        chips: ['What do you think of me?', 'Got a confession?', "What's your biggest fear?", 'Most embarrassing moment?', 'Any advice for me?'],
        ctaOpen: 'Get your own question box →',
        ctaSub: 'Install Strangr, put your link in your story and let anyone message you anonymously.',
        saveLink: 'Copy my reply link',
        copied: 'Copied ✓',
        send: 'Send Anonymously',
        hint: 'Your message is completely anonymous. Harassment, threats and illegal content can be reported to moderation.',
        myMessagesLink: 'Messages I sent before →',
        doneTitle: '📮 Delivered!',
        doneBody: "Your message arrived anonymously.<br />If they reply, you'll see it on this page. Checking from another browser? Copy your reply link first — no account needed.",
        waitReply: 'See Replies',
        again: 'Send another message',
        repliesTitle: 'Messages I Sent',
        repliesSub: 'Messages you sent from this browser and their replies (if any) — your identity is never shown.',
        back: '← Send a new message',
        noneSent: "You haven't sent any messages from this browser yet.",
        loading: 'Loading...',
        noReply: 'No reply yet',
        replyLabel: 'REPLY',
        rateLimited: "You're sending messages too fast, try again in a bit.",
        sendFailed: "Couldn't send, please try again."
      }
    };
    function tr(key) { return STRINGS[LANG][key]; }
    document.documentElement.lang = LANG;
    document.title = tr('title');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) { n.textContent = tr(n.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-html]'), function (n) { n.innerHTML = tr(n.getAttribute('data-i18n-html')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-placeholder]'), function (n) { n.placeholder = tr(n.getAttribute('data-i18n-placeholder')); });

    var FN = 'https://tvjlvufrpcdceydlccvb.supabase.co/functions/v1/anon-inbox';
    var STORAGE_KEY = 'strangr_sent_v1';
    var hash = (location.hash || '').replace(/^#\/?/, '');
    var slug = decodeURIComponent(hash);

    var el = function (id) { return document.getElementById(id); };
    var lastToken = null;
    function show(id) {
      ['loading', 'notfound', 'form', 'done', 'replies'].forEach(function (s) {
        el(s).classList.toggle('hidden', s !== id);
      });
    }

    function loadSent() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch (e) { return []; }
    }
    function saveSent(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, 50)));
    }
    function rememberSent(token, text) {
      var list = loadSent();
      list.unshift({ token: token, text: text, sentAt: Date.now() });
      saveSent(list);
    }

    function renderReplies() {
      var list = loadSent();
      var container = el('repliesList');
      container.innerHTML = '';
      if (!list.length) {
        var p = document.createElement('p');
        p.className = 'sub';
        p.textContent = tr('noneSent');
        container.appendChild(p);
        return;
      }
      var wrap = document.createElement('div');
      wrap.className = 'repliesList';
      container.appendChild(wrap);
      list.forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'replyRow';
        var sentP = document.createElement('p');
        sentP.className = 'sentText';
        sentP.textContent = item.text;
        row.appendChild(sentP);
        var pendingP = document.createElement('p');
        pendingP.className = 'pending';
        pendingP.textContent = tr('loading');
        row.appendChild(pendingP);
        wrap.appendChild(row);

        fetch(FN + '?token=' + encodeURIComponent(item.token))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.reply_text) {
              pendingP.remove();
              var box = document.createElement('div');
              box.className = 'replyBox';
              var label = document.createElement('div');
              label.className = 'replyLabel';
              label.textContent = tr('replyLabel');
              var text = document.createElement('p');
              text.className = 'replyText';
              text.textContent = d.reply_text;
              box.appendChild(label);
              box.appendChild(text);
              row.appendChild(box);
            } else {
              pendingP.textContent = tr('noReply');
            }
          })
          .catch(function () {
            pendingP.textContent = tr('noReply');
          });
      });
    }

    window.addEventListener('hashchange', function () { location.reload(); });

    function buildChips() {
      var box = el('chips');
      tr('chips').forEach(function (q) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = q;
        b.addEventListener('click', function () {
          el('text').value = q;
          el('count').textContent = String(q.length);
          el('text').focus();
        });
        box.appendChild(b);
      });
    }
    buildChips();

    if (hash.indexOf('r=') === 0) {
      // Portable reply link (#r=<token>): opens in any browser, then lands in
      // this browser's own list so it keeps showing under "Messages I sent".
      var linkToken = hash.slice(2);
      fetch(FN + '?token=' + encodeURIComponent(linkToken))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.text) { show('notfound'); return; }
          if (!loadSent().some(function (i) { return i.token === linkToken; })) {
            rememberSent(linkToken, d.text);
          }
          history.replaceState(null, '', '#r');
          show('replies');
          renderReplies();
        })
        .catch(function () { show('notfound'); });
    } else if (hash === 'r') {
      show('replies');
      renderReplies();
    } else if (!slug) {
      show('notfound');
    } else {
      fetch(FN + '?slug=' + encodeURIComponent(slug))
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (p) {
          el('nickname').textContent = p.nickname;
          if (p.photo_url) el('avatar').src = p.photo_url;
          else el('avatar').removeAttribute('src');
          show('form');
        })
        .catch(function () { show('notfound'); });
    }

    el('text').addEventListener('input', function () {
      el('count').textContent = String(el('text').value.length);
    });

    el('send').addEventListener('click', function () {
      var text = el('text').value.trim();
      if (!text) return;
      el('send').disabled = true;
      el('error').classList.add('hidden');
      fetch(FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: slug, text: text }),
      })
        .then(function (r) {
          if (r.ok) return r.json();
          if (r.status === 429) throw new Error(tr('rateLimited'));
          throw new Error(tr('sendFailed'));
        })
        .then(function (d) {
          if (d && d.token) { rememberSent(d.token, text); lastToken = d.token; }
          el('text').value = '';
          el('count').textContent = '0';
          show('done');
        })
        .catch(function (e) {
          el('error').textContent = e.message || tr('sendFailed');
          el('error').classList.remove('hidden');
        })
        .finally(function () { el('send').disabled = false; });
    });

    el('again').addEventListener('click', function () { show('form'); });
    el('copyLink').addEventListener('click', function () {
      if (!lastToken) return;
      var link = location.origin + '/#r=' + lastToken;
      var btn = el('copyLink');
      var done = function () {
        btn.textContent = tr('copied');
        setTimeout(function () { btn.textContent = tr('saveLink'); }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done, function () { window.prompt('', link); });
      } else {
        window.prompt('', link);
      }
    });
    el('viewReplies').addEventListener('click', function () { location.hash = 'r'; });
    el('backLink').addEventListener('click', function (e) { e.preventDefault(); show('form'); });
  </script>
</body>
</html>
